<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Állati Aréna</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/challenges.css">
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="logo">
        <span class="icon logo-icon" data-icon="paw"></span>
        <h1>Állati Aréna</h1>
      </div>
      <div class="pills">
        <div class="gold-pill trophy-pill"><span class="icon" data-icon="trophy"></span><span id="trophy-amount">0</span></div>
        <div class="gold-pill"><span class="icon" data-icon="gold"></span><span id="gold-amount">0</span></div>
      </div>
    </header>

    <main id="content">
      <!-- SHOP -->
      <section class="tab-page" id="page-shop">
        <div id="shop-page"></div>
      </section>

      <!-- DECK BUILDER -->
      <section class="tab-page" id="page-deck">
        <h2 class="page-title">Paklim (8 kártya)</h2>
        <div id="swap-banner" class="swap-banner hidden">
          <span>Válaszd ki, melyik kártya helyére kerüljön!</span>
          <button id="btn-swap-cancel">Mégse</button>
        </div>
        <div id="deck-grid" class="card-grid"></div>
        <h2 class="page-title">Gyűjtemény</h2>
        <div id="collection-grid" class="card-grid"></div>
      </section>

      <!-- BATTLE LOBBY -->
      <section class="tab-page active" id="page-battle">
        <div class="arena-card">
          <div class="arena-nav">
            <button id="btn-arena-prev" class="arena-arrow">&lsaquo;</button>
            <div class="arena-label" id="arena-label">1. Aréna</div>
            <button id="btn-arena-next" class="arena-arrow">&rsaquo;</button>
          </div>
          <div class="arena-preview-wrap">
            <canvas id="arena-preview"></canvas>
            <div id="arena-lock" class="arena-lock hidden">
              <span class="icon" data-icon="lock"></span>
              <span id="arena-lock-text"></span>
            </div>
          </div>
          <h2 id="arena-name">Farm</h2>
          <div class="arena-hint">Kattints az arénára: mit találsz benne?</div>
          <div id="arena-progress" class="arena-progress"></div>
        </div>
        <button id="btn-fight" class="big-btn">Csata!</button>
        <h3 class="chest-title">Ládák</h3>
        <div id="chest-slots" class="chest-slots"></div>
      </section>

      <!-- CHALLENGE -->
      <section class="tab-page" id="page-challenge">
        <div id="challenge-page"></div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab" data-tab="shop"><span class="icon" data-icon="shop"></span><span>Bolt</span></button>
      <button class="tab" data-tab="deck"><span class="icon" data-icon="deck"></span><span>Pakli</span></button>
      <button class="tab active" data-tab="battle"><span class="icon" data-icon="battle"></span><span>Csata</span></button>
      <button class="tab" data-tab="challenge"><span class="icon" data-icon="trophy"></span><span>Kihívás</span></button>
    </nav>

    <!-- CARD DETAILS (opens when you tap a card) -->
    <div id="card-modal" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" id="btn-card-close">&times;</button>
        <div id="card-modal-body"></div>
      </div>
    </div>

    <!-- ALL ARENAS (opens when you click the arena picture) -->
    <div id="arena-modal" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" id="btn-arena-close">&times;</button>
        <h3 class="chest-modal-title">Arénák</h3>
        <div id="arena-list" class="arena-list"></div>
      </div>
    </div>

    <!-- CHEST REWARDS -->
    <div id="chest-modal" class="modal hidden">
      <div class="modal-box" id="chest-modal-body"></div>
    </div>

    <!-- BATTLE SCREEN (covers the whole app while fighting) -->
    <div id="battle-screen" class="hidden">
      <div class="canvas-wrap">
        <canvas id="battle-canvas" width="360" height="640"></canvas>
      </div>
      <div class="hand">
        <div class="feed-bar">
          <span class="icon feed-icon" data-icon="feed"></span>
          <div class="feed-track"><div id="feed-fill"></div></div>
          <span id="feed-count">5</span>
        </div>
        <div id="hand-cards"></div>
      </div>

      <div id="result" class="hidden">
        <div class="result-box">
          <h2 id="result-title"></h2>
          <p id="result-crowns"></p>
          <div id="result-chest"></div>
          <button id="btn-result-ok" class="big-btn">Tovább</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/save.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/arenas.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/members.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
